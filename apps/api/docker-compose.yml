services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klymon
      POSTGRES_PASSWORD: klymon
      POSTGRES_DB: klymon
    ports:
      - "5432:5432"
    volumes:
      - klymon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klymon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  klymon-pgdata:
