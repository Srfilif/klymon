name: Release

# Tag pushes (v*) build every platform and upload the installers to a draft
# GitHub release. Manual runs execute the same gates and builds but publish
# nothing, which is how you dry-run the pipeline.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win
            os: windows-latest
            builder-args: --win nsis
          - name: linux
            os: ubuntu-latest
            builder-args: --linux
          - name: mac
            os: macos-latest
            builder-args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build app bundles
        run: pnpm build

      - name: Package (${{ matrix.name }})
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --config electron-builder.yml --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist-artifacts

      # One job publishes everything so parallel builders can never race or
      # create duplicate drafts. Re-running the workflow re-uploads into the
      # same draft (--clobber) instead of failing.
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading files into it."
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist-artifacts/* --clobber
