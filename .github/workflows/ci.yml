name: CI

# Fast gates on every push to main and every pull request: types, unit tests
# and the production bundles (which also validate the electron-vite aliases).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Latest 22.x (>= 22.14): better-sqlite3 13 needs Node-API 10 and
          # segfaults below 22.14 instead of failing cleanly.
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (high and critical block)
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generate Prisma client
        run: pnpm --filter @klymon/api prisma:generate

      - name: API typecheck
        run: pnpm --filter @klymon/api typecheck

      - name: API unit tests
        run: pnpm --filter @klymon/api test

      - name: Landing typecheck and build
        run: pnpm --filter @klymon/landing build

      - name: Dashboard and admin typecheck and build
        run: pnpm --filter @klymon/dashboard build && pnpm --filter @klymon/admin build

      - name: Build app bundles
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
