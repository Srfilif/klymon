name: Scheduled E2E

# Weekly live-server end-to-end (Mojang downloads + real game launch).
# Never blocks pull requests: scheduled runs and manual dispatches only.
# The launch suite opens a game window, so it runs under xvfb on Linux.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-scheduled
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Same floor as CI: better-sqlite3 13 needs Node-API 10.
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live install suite (real Mojang downloads)
        run: pnpm test:e2e:install

      - name: Live launch suite (real game window under xvfb)
        run: xvfb-run -a pnpm test:e2e:launch

  link-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live link suite (${{ matrix.mc }})
        run: xvfb-run -a pnpm test:e2e:link
        env:
          KLYMON_E2E_MC: ${{ matrix.mc }}
